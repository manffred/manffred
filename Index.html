<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspirational Message</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #a1c4fd, #c2e9fb);
            color: #333;
            text-align: center;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 2s ease-in-out;
        }

        .message-box h1 {
            font-size: 2em;
            margin: 0 0 10px;
            color: #444;
        }

        .message-box p {
            font-size: 1.2em;
            color: #666;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div>.</div>
    <div class="message-box">
        <h1>Believe in Yourself</h1>
        <p>Every small step takes you closer to your dreams. 🌟</p>
    </div>
</body>
</html>
