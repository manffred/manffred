<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile UI Home Screen</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #111;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .homescreen {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 20px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    background-color: #000;
    border-radius: 30px;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
  }

  .app-icon {
    width: 60px;
    height: 60px;
    background-color: #444;
    border-radius: 15px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
</style>

</head>
<body>
  <div class="homescreen">
    <div class="app">
      <div class="app-icon">📞</div>
      <div>Phone</div>
    </div>
    <div class="app">
      <div class="app-icon">💬</div>
      <div>Messages</div>
    </div>
    <div class="app">
      <div class="app-icon">📷</div>
      <div>Camera</div>
    </div>
    <div class="app">
      <div class="app-icon">📸</div>
      <div>Photos</div>
    </div>
    <div class="app">
      <div class="app-icon">🌐</div>
      <div>Browser</div>
    </div>
    <div class="app">
      <div class="app-icon">📧</div>
      <div>Mail</div>
    </div>
    <div class="app">
      <div class="app-icon">🎵</div>
      <div>Music</div>
    </div>
    <div class="app">
      <div class="app-icon">⚙️</div>
      <div>Settings</div>
    </div>
    <!-- Add more apps if needed -->
  </div>
</body>
</html>
