<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile UI Home Screen</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #111;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .homescreen {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 24px;
    width: 100%;
    max-width: 390px; /* iPhone 14 width */
    height: 844px;     /* iPhone 14 height */
    background-color: #000;
    border-radius: 40px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
  }

  .app-icon {
    width: 72px;
    height: 72px;
    background-color: #444;
    border-radius: 20px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  @media (max-width: 420px) {
    .homescreen {
      height: 100vh;
      max-width: 100%;
      border-radius: 0;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      font-size: 24px;
    }

    .app {
      font-size: 12px;
    }
  }
</style>

</head>
<body>
  <div class="homescreen">
    <div class="app">
      <div class="app-icon">📞</div>
      <div>Phone</div>
    </div>
    <div class="app">
      <div class="app-icon">💬</div>
      <div>Messages</div>
    </div>
    <div class="app">
      <div class="app-icon">📷</div>
      <div>Camera</div>
    </div>
    <div class="app">
      <div class="app-icon">📸</div>
      <div>Photos</div>
    </div>
    <div class="app">
      <div class="app-icon">🌐</div>
      <div>Browser</div>
    </div>
    <div class="app">
      <div class="app-icon">📧</div>
      <div>Mail</div>
    </div>
    <div class="app">
      <div class="app-icon">🎵</div>
      <div>Music</div>
    </div>
    <div class="app">
      <div class="app-icon">⚙️</div>
      <div>Settings</div>
    </div>
    <!-- Add more apps if needed -->
  </div>
</body>
</html>
